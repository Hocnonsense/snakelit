[project]
name = "snakelit"
version = "0.0.1"
description = "Reusable Streamlit widgets for Snakemake workflows"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.40,<2"]

[project.optional-dependencies]
tables = ["polars>=1.30,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snakelit"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
snakelit = { path = ".", editable = true }

[tool.pixi.feature.test.pypi-dependencies]
pytest = "*"
polars = ">=1.30,<3"

[tool.pixi.environments]
test = ["test"]
